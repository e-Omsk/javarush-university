# Минимальный compose-файл: один сервис, встроенная H2.
# Запуск:   docker compose up --build
# Остановка: docker compose down
services:
  app:
    build: .
    image: m5-level-22:1.0
    container_name: m5-level-22
    ports:
      - "8080:8080"
    environment:
      # Пример проброса переменной окружения – Spring подхватит её как app.greeting.
      APP_GREETING: "Привет из контейнера!"
